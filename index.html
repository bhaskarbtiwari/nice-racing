<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>3D Racing</title>
    <!-- Inline SVG favicon to avoid 404 for favicon.ico -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ffdd00'/%3E%3Ctext x='8' y='11' font-size='9' font-family='Arial' text-anchor='middle' fill='%23000'%3EL%3C/text%3E%3C/svg%3E">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <!-- the timestamp makes the browser fetch the newest script and styles on every normal reload -->
    <script>document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '" />');</script>
  </head>
  <body>
    <div id="ui">
      <button id="menuBtn">Menu</button>
      <button id="resetBtn">Restart</button>
      <span>Esc: pause</span>
    </div>
    <div class="hud" id="hud1"></div>
    <div class="hud" id="hud2"></div>
    <canvas id="minimap" width="220" height="165" aria-label="track map"></canvas>
    <div id="countdown"></div>
    <div id="menu">
      <div id="menuBox">
        <h2>3D Racing</h2>
        <div class="row"><span>Mode</span>
          <div class="seg" id="modeSeg"><button data-v="1" class="on">1 Player</button><button data-v="2">2 Players</button></div>
        </div>
        <div class="row"><span>Track</span><button id="trackBtn" class="pick" type="button"></button></div>
        <small id="trackInfo"></small>
        <div class="row"><span id="car1Label">Your car</span><select id="car1Select"></select></div>
        <div class="row"><span id="car2Label">Computer car</span><select id="car2Select"></select></div>
        <div class="row"><span>Laps</span><select id="lapsSelect"></select></div>
        <button id="startBtn" disabled>Loading...</button>
        <p class="keys">1 Player: W A S D or arrow keys<br>2 Players: Player 1 W A S D, Player 2 arrow keys<br>R / Enter: back on track &nbsp; Esc: pause</p>
      </div>
    </div>
    <div id="trackPicker">
      <div id="pickerBox">
        <h2>Select track</h2>
        <div id="trackGrid"></div>
        <button id="pickerBack" type="button">Back</button>
      </div>
    </div>
    <div id="overlay">
      <div id="overlayBox">
        <h2 id="overlayTitle"></h2>
        <p id="overlayBody"></p>
        <button id="resumeBtn">Resume</button>
        <button id="restartBtn">Restart race</button>
        <button id="menuBtn2">Menu</button>
      </div>
    </div>
    <div id="canvas-container"></div>

    <!-- Import map to resolve bare specifier 'three' used by JSM examples -> points to unpkg module build -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
        }
      }
    </script>
    <!-- Load Three.js + GLTFLoader as modules and expose to global scope for main.js -->
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
      // expose to non-module scripts
      window.THREE = THREE;
      window.GLTFLoader = GLTFLoader;
    </script>
    <script>document.write('<script src="main.js?v=' + Date.now() + '"><\/script>');</script>
  </body>
</html>
