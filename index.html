<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>3D Car Driving Demo</title>
    <!-- Inline SVG favicon to avoid 404 for favicon.ico -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ffdd00'/%3E%3Ctext x='8' y='11' font-size='9' font-family='Arial' text-anchor='middle' fill='%23000'%3EL%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="ui">
      <h1>3D Car Driving Demo</h1>
      <p>W/S or ↑/↓: accelerate / brake &nbsp; A/D or ←/→: steer &nbsp; Space: handbrake</p>
      <label for="carSelect">Choose car:</label>
      <select id="carSelect">
        <option value="primitive">Primitive Lambo</option>
        <option value="VC">VC (sample)</option>
        <option value="Buggy">Buggy</option>
        <option value="CesiumMilkTruck">CesiumMilkTruck</option>
        <option value="ClearCoatCarPaint">ClearCoatCarPaint</option>
        <option value="ToyCar">ToyCar</option>
        <option value="CarbonFibre">CarbonFibre</option>
      </select>
      <button id="loadCarBtn">Load selected car</button>
      <p>Speed: <span id="speed">0</span> m/s &nbsp; <button id="resetBtn">Reset</button></p>
      <p>Pos: <span id="pos">0,0,0</span> &nbsp; OnTrack: <span id="onTrack">false</span></p>
      <canvas id="speedometer" width="160" height="160" aria-label="speedometer"></canvas>
    </div>
    <div id="canvas-container"></div>

    <!-- Import map to resolve bare specifier 'three' used by JSM examples -> points to unpkg module build -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
        }
      }
    </script>
    <!-- Load Three.js + GLTFLoader as modules and expose to global scope for main.js -->
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
      // expose to non-module scripts
      window.THREE = THREE;
      window.GLTFLoader = GLTFLoader;
    </script>
    <script src="main.js"></script>
    <script>
      // loadCarBtn behavior: tells main.js to load a specific model via window._CAR_DEMO API
      document.addEventListener('DOMContentLoaded', function() {
        const sel = document.getElementById('carSelect');
        const btn = document.getElementById('loadCarBtn');
        btn.addEventListener('click', () => {
          const v = sel.value;
          if (window._CAR_DEMO && window._CAR_DEMO.loadModel) {
            window._CAR_DEMO.loadModel(v);
          } else {
            alert('Loader not ready yet');
          }
        });
      });
    </script>
  </body>
</html>
