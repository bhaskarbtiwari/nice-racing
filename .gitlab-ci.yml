# Publishes the game as a static site on GitLab Pages.
# The site is the game's own files only; tests, notes and tools stay in the repository.
pages:
  stage: deploy
  script:
    - mkdir public
    - cp -r index.html main.js style.css models public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
